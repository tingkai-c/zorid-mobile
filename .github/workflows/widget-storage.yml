name: Verify native widget storage
on:
  push:
    paths:
      - native/actions/ZoridActionSurfaces.swift
      - scripts/ios/test-widget-storage.py
      - .github/workflows/widget-storage.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify accepted widget writes and genuine storage failures
        run: python3 scripts/ios/test-widget-storage.py
