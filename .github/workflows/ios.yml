name: Build iOS
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Simulator, signed registered-device IPA, or internal TestFlight upload
        type: choice
        options: [simulator, device, testflight]
        default: simulator
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      CI: '1'
      BUILD_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)" -ge 27
      - name: Verify internal TestFlight export support
        if: inputs.mode == 'testflight'
        run: |
          xcodebuild -help > "$RUNNER_TEMP/xcodebuild-help.txt" 2>&1
          if ! grep -q 'testFlightInternalTestingOnly' "$RUNNER_TEMP/xcodebuild-help.txt"; then
            echo 'This Xcode version does not advertise internal-only TestFlight export.' >&2
            exit 1
          fi
      - name: Verify build script with runner Bash
        run: BASH_BINARY=/bin/bash python3 scripts/ios/test-build.py
      - name: Verify native pairing and shake detection
        run: |
          swiftc modules/zorid-shell/ios/ZoridPairing.swift modules/zorid-shell/ios/ZoridShakeDetector.swift scripts/ios/test-native-pairing.swift -o "$RUNNER_TEMP/zorid-native-shell-checks"
          "$RUNNER_TEMP/zorid-native-shell-checks"
      - run: bun install --frozen-lockfile
      - name: Verify downloaded actions and native routes
        run: |
          bun scripts/build-actions.ts --check
          swiftc modules/zorid-actions/ios/ZoridActionStore.swift modules/zorid-actions/ios/ZoridActionRuntime.swift scripts/ios/test-actions.swift -framework JavaScriptCore -lsqlite3 -o "$RUNNER_TEMP/zorid-action-checks"
          "$RUNNER_TEMP/zorid-action-checks"
          swiftc modules/zorid-actions/ios/ZoridActionStore.swift modules/zorid-actions/ios/ZoridActionRuntime.swift scripts/ios/test-focus-actions.swift -framework JavaScriptCore -lsqlite3 -o "$RUNNER_TEMP/zorid-focus-action-checks"
          "$RUNNER_TEMP/zorid-focus-action-checks" build/actions/focus-control.txt
          swiftc modules/zorid-shell/ios/ZoridRoutes.swift modules/zorid-shell/tests/test-routes.swift -o "$RUNNER_TEMP/zorid-route-checks"
          "$RUNNER_TEMP/zorid-route-checks"
      - name: Configure public update trust anchor
        env:
          ZORID_UPDATE_URL: ${{ vars.ZORID_UPDATE_URL }}
          ZORID_UPDATE_CERTIFICATE_BASE64: ${{ vars.ZORID_UPDATE_CERTIFICATE_BASE64 }}
        run: python3 scripts/ios/configure-updates.py
      - run: bunx expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios
      - name: Install signing material
        if: inputs.mode != 'simulator'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILES_ZIP_BASE64: ${{ secrets.IOS_PROFILES_ZIP_BASE64 }}
          IOS_APP_STORE_PROFILES_ZIP_BASE64: ${{ secrets.IOS_APP_STORE_PROFILES_ZIP_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash scripts/ios/signing.sh
      - name: Compile and package
        run: bash scripts/ios/build.sh
      - name: Simulator install and launch smoke
        if: inputs.mode == 'simulator'
        timeout-minutes: 12
        run: python3 scripts/ios/simulator-smoke.py
      - name: Downloadable build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zorid-${{ inputs.mode }}-${{ github.run_number }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 7
      - name: Encrypt private failure diagnostics
        if: failure() && inputs.mode != 'simulator'
        env:
          ZORID_DIAGNOSTIC_CERTIFICATE_BASE64: ${{ vars.ZORID_DIAGNOSTIC_CERTIFICATE_BASE64 }}
        run: python3 scripts/ios/encrypt-diagnostics.py
      - name: Encrypted signing diagnostics
        if: failure() && inputs.mode != 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-signing-diagnostics-${{ github.run_number }}
          path: build/private-diagnostics.cms
          if-no-files-found: ignore
          retention-days: 3
      - name: Unsigned build diagnostics
        if: always() && inputs.mode == 'simulator'
        uses: actions/upload-artifact@v4
        with:
          name: simulator-diagnostics-${{ github.run_number }}
          path: |
            build/build.log
            build/Build.xcresult
            build/smoke
          retention-days: 7
      - name: Shut down smoke simulator
        if: always() && inputs.mode == 'simulator'
        run: python3 scripts/ios/simulator-smoke.py --cleanup
      - name: Remove signing material
        if: always()
        run: bash scripts/ios/cleanup.sh
