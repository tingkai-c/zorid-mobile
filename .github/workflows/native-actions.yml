name: Verify native actions
on:
  push:
    paths:
      - modules/zorid-actions/ios/**
      - modules/zorid-screen-time/**
      - native/screen-time/**
      - modules/zorid-shell/ios/ZoridHaptics.swift
      - modules/zorid-shell/ios/ZoridCoreHaptics.swift
      - modules/zorid-shell/ios/ZoridHapticLifecycle.swift
      - modules/zorid-shell/tests/test-haptic-lifecycle.swift
      - modules/zorid-device/**
      - native/actions/ZoridSurfaceEffectQueue.swift
      - scripts/ios/test-surface-effects.swift
      - src/actions/**
      - src/domain/focus.ts
      - src/features/focus-action*.ts
      - src/native/focus*.ts
      - scripts/ios/test-actions.swift
      - scripts/ios/test-focus-actions.swift
      - scripts/ios/test-pause-numeric.swift
      - .github/workflows/native-actions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actions:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Compile the actual downloaded handler
        run: bun scripts/build-actions.ts --check
      - name: Verify atomic native actions and Focus lifecycle
        run: |
          swiftc modules/zorid-actions/ios/ZoridActionStore.swift modules/zorid-actions/ios/ZoridActionRuntime.swift scripts/ios/test-actions.swift -framework JavaScriptCore -lsqlite3 -o "$RUNNER_TEMP/zorid-action-checks"
          "$RUNNER_TEMP/zorid-action-checks"
          swiftc modules/zorid-actions/ios/ZoridActionStore.swift modules/zorid-actions/ios/ZoridActionRuntime.swift scripts/ios/test-focus-actions.swift -framework JavaScriptCore -lsqlite3 -o "$RUNNER_TEMP/zorid-focus-action-checks"
          "$RUNNER_TEMP/zorid-focus-action-checks" build/actions/focus-control.txt
          swiftc -swift-version 5 native/actions/ZoridSurfaceEffectQueue.swift scripts/ios/test-surface-effects.swift -o "$RUNNER_TEMP/zorid-surface-checks"
          "$RUNNER_TEMP/zorid-surface-checks"
      - name: Verify Screen Time planning and actual iOS framework types
        if: always()
        run: |
          swiftc modules/zorid-screen-time/ios/ZoridScreenTimePlan.swift modules/zorid-screen-time/tests/test-plan.swift -o "$RUNNER_TEMP/zorid-screen-time-checks"
          "$RUNNER_TEMP/zorid-screen-time-checks"
          swiftc modules/zorid-screen-time/ios/ZoridScreenTimeShield.swift modules/zorid-screen-time/tests/test-shield.swift -o "$RUNNER_TEMP/zorid-shield-checks"
          "$RUNNER_TEMP/zorid-shield-checks"
          sdk_path="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swiftc -sdk "$sdk_path" -target arm64-apple-ios16.4-simulator -typecheck modules/zorid-screen-time/ios/ZoridScreenTimePlan.swift modules/zorid-screen-time/ios/ZoridScreenTimeShield.swift modules/zorid-screen-time/ios/ZoridScreenTimeController.swift native/screen-time/*.swift
          swiftc -sdk "$sdk_path" -target arm64-apple-ios16.4-simulator -typecheck modules/zorid-shell/ios/ZoridHaptics.swift
          swiftc modules/zorid-shell/ios/ZoridHapticLifecycle.swift modules/zorid-shell/tests/test-haptic-lifecycle.swift -o "$RUNNER_TEMP/zorid-haptic-lifecycle-checks"
          "$RUNNER_TEMP/zorid-haptic-lifecycle-checks"
          swiftc modules/zorid-device/ios/ZoridNotificationPayload.swift modules/zorid-device/ios/ZoridNotificationResponseStore.swift modules/zorid-device/tests/test-notifications.swift -o "$RUNNER_TEMP/zorid-notification-checks"
          "$RUNNER_TEMP/zorid-notification-checks"
          swiftc -sdk "$sdk_path" -target arm64-apple-ios16.4-simulator -typecheck modules/zorid-shell/ios/ZoridHapticLifecycle.swift modules/zorid-shell/ios/ZoridCoreHaptics.swift
          swiftc -sdk "$sdk_path" -target arm64-apple-ios16.4-simulator -typecheck modules/zorid-device/ios/ZoridDeviceSupport.swift modules/zorid-device/ios/ZoridNotificationPayload.swift modules/zorid-device/ios/ZoridNotificationResponseStore.swift modules/zorid-device/ios/ZoridDeviceAuthentication.swift modules/zorid-device/ios/ZoridDeviceNotifications.swift modules/zorid-device/ios/ZoridDeviceMedia.swift modules/zorid-device/ios/ZoridDeviceCalendar.swift
      - name: Compare native record decoding with JavaScript JSON parsing
        if: always()
        run: |
          swiftc modules/zorid-actions/ios/ZoridActionStore.swift modules/zorid-actions/ios/ZoridActionRuntime.swift scripts/ios/test-pause-numeric.swift -framework JavaScriptCore -lsqlite3 -o "$RUNNER_TEMP/zorid-pause-numeric-checks"
          "$RUNNER_TEMP/zorid-pause-numeric-checks"
